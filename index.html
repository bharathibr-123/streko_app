<head>
<meta charset="utf-8" />

<title>Ganesha</title>
<meta name="theme-color" content="#FDF5E2" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  :root{
    --paper:#FCF1D8;
    --card:#FFFFFF; --ink:#000000; --ink-soft:#000000; --navy:#1B2F5E;
    --weekday:#1B2F5E; --weekday-bg:#DCEEF9;   /* Default */
    --weekend:#C98B62; --weekend-bg:#F6D7BF;   /* Custom: soft skin / peach */
    --gold:#F2B441; --dot:#FFE58A; --dot-edge:#E0B53A; --line:#EADCC0;
    --up:#2E9E4F; --down:#D93025;              /* chart line */
    --wrong:#8B0000; --wrong-bg:#F8E1E1; --done:#2E8B12; --done-bg:#FFFFFF;   /* ticked: dark parrot green */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); }
  html{ background:#FAEBCB; min-height:100%; }
  body{ background:transparent !important; }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:1.25rem 1rem 2rem; }
  .lotus{ filter: drop-shadow(0 0 1.5px rgba(190,140,60,0.55)) drop-shadow(0 0 6px rgba(255,255,255,0.8)); pointer-events:none; }
  .spark{ position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; box-shadow:0 0 6px 2px rgba(255,236,170,0.9); pointer-events:none; }
  .ganesha{ filter: drop-shadow(0 0 1px rgba(150,100,20,0.95)) drop-shadow(0 0 2px rgba(190,140,50,0.6)) drop-shadow(0 0 9px rgba(255,255,255,0.95)); }
  .spark.tw{ animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.25; transform:scale(0.7);} 50%{ opacity:1; transform:scale(1.25);} }
  .shine{ position:relative; overflow:hidden; }
  .shine::after{ content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,236,180,0.22) 50%, rgba(255,255,255,0) 100%);
    animation: sheen 7s ease-in-out infinite; pointer-events:none; }
  @keyframes sheen{ 0%,60%{ left:-60%; } 100%{ left:130%; } }
  @media (prefers-reduced-motion: reduce){ .spark.tw, .shine::after{ animation:none; } }
  .decor{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; background:radial-gradient(ellipse at 22% 8%, #FFFDF6 0%, rgba(255,250,235,0.9) 18%, rgba(255,244,215,0) 48%),
      radial-gradient(ellipse at 80% 100%, rgba(236,232,236,0.9) 0%, rgba(236,232,236,0) 55%),
      linear-gradient(180deg, #FDF5E2 0%, #FAEBCB 45%, #F5E6CF 75%, #EFE9E4 100%); }
  .serif{ font-family: Georgia, 'Iowan Old Style', serif; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .card.flat{ background:transparent; border:none; box-shadow:none; }   /* sections sit on the background itself */
  .card.flat > .row{ border-color:rgba(150,110,50,0.28) !important; }
  .btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; color:var(--ink); }
  .btn:disabled{ color:#B8C2CC; cursor:default; }
  input[type=text], input[type=password], input[type=date]{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; color:var(--ink); outline:none; width:100%;
  }
  ::-webkit-scrollbar{ height:0; width:0; }
</style>
</head>
